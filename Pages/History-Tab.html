<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Picta: Saved Assistive Snapshots & Color Analysis Gallery">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Picta · Snapshot History</title>

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://code.getmdl.io/1.2.1/material.indigo-pink.min.css" />
    <link rel="stylesheet" href="../Assets/CSS/style.css">
</head>

<body class="picta-body">
    <div class="picta-page-container">
        <!-- Page Header -->
        <header class="page-header">
            <div class="page-title-row">
                <a href="../index.html" class="icon-btn" title="Back to Camera" aria-label="Back to Camera">
                    <i class="material-icons">arrow_back</i>
                </a>
                <h1 class="page-title">Snapshot History</h1>
            </div>
            <div>
                <button id="btn-clear-all" class="icon-btn" title="Clear All History" aria-label="Clear All History">
                    <i class="material-icons">delete_sweep</i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="page-content-area">
            <div id="history-container">
                <!-- Dynamically rendered snapshots -->
            </div>
        </main>

        <!-- Bottom Navigation Bar -->
        <footer class="picta-bottom-bar" style="position: fixed; bottom: 0; left: 0; right: 0;">
            <a href="History-Tab.html" class="nav-tab-btn active" title="Saved Snapshots">
                <i class="material-icons">history</i>
                <span class="nav-label">History</span>
            </a>
            <div class="shutter-wrapper">
                <a href="../index.html" class="shutter-btn" title="Return to Live Camera" aria-label="Camera">
                    <div class="shutter-inner" style="background: var(--picta-primary);">
                        <i class="material-icons shutter-icon">photo_camera</i>
                    </div>
                </a>
            </div>
            <a href="Settings-Tab.html" class="nav-tab-btn" title="App Settings">
                <i class="material-icons">tune</i>
                <span class="nav-label">Settings</span>
            </a>
        </footer>
    </div>

    <!-- Script to render & manage snapshots -->
    <script>
        (function() {
            const container = document.getElementById('history-container');
            const btnClearAll = document.getElementById('btn-clear-all');

            function getSnapshots() {
                try {
                    const data = localStorage.getItem('picta_snapshots');
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveSnapshots(list) {
                try {
                    localStorage.setItem('picta_snapshots', JSON.stringify(list));
                } catch (e) {
                    console.warn(e);
                }
            }

            function render() {
                const list = getSnapshots();
                if (!list || list.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="material-icons">photo_library</i>
                            <h3>No Snapshots Yet</h3>
                            <p>Capture photos from the live camera with Daltonization filters to inspect colors and save them here.</p>
                            <a href="../index.html" class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored" style="margin-top: 16px;">
                                Open Camera
                            </a>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="history-grid">';
                list.forEach((item, index) => {
                    const color = item.colorSample || { name: 'Sampled Color', hex: '#808080' };
                    html += `
                        <div class="snapshot-card" data-id="${item.id}">
                            <div class="snapshot-img-wrap">
                                <img src="${item.dataUrl}" alt="Snapshot ${index + 1}" class="snapshot-img" loading="lazy">
                                <span class="snapshot-badge">${item.filterLabel || 'ORIGINAL'}</span>
                            </div>
                            <div class="snapshot-meta">
                                <div class="snapshot-title-row">
                                    <div class="snapshot-color-chip">
                                        <div class="chip-circle" style="background-color: ${color.hex};"></div>
                                        <span>${color.name}</span>
                                    </div>
                                    <span class="snapshot-time">${item.formattedDate || ''}</span>
                                </div>
                                <div class="snapshot-actions">
                                    <a href="${item.dataUrl}" download="picta-${item.id}.jpg" class="snapshot-btn" title="Download">
                                        <i class="material-icons">download</i>
                                    </a>
                                    <button class="snapshot-btn btn-delete" data-id="${item.id}" title="Delete">
                                        <i class="material-icons">delete</i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

                // Bind delete buttons
                container.querySelectorAll('.btn-delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        deleteSnapshot(id);
                    });
                });
            }

            function deleteSnapshot(id) {
                let list = getSnapshots();
                list = list.filter(item => item.id !== id);
                saveSnapshots(list);
                render();
            }

            if (btnClearAll) {
                btnClearAll.addEventListener('click', function() {
                    if (confirm('Clear all saved snapshots from history?')) {
                        localStorage.removeItem('picta_snapshots');
                        render();
                    }
                });
            }

            render();
        })();
    </script>
</body>
</html>
